<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">踏雪节气拍立得</title>
  <desc id="desc">给一个主题，它把这个主题该有的画面和场景推出来。</desc>

  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EDE7DA"/>
      <stop offset="1" stop-color="#E3DCCE"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="260" rx="26" fill="url(#paper)"/>
  <g stroke="#D4CBB8" stroke-width="1" opacity="0.7">
    <line x1="0" y1="56" x2="1200" y2="58"/>
    <line x1="0" y1="204" x2="1200" y2="202"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans SC', 'Segoe UI', sans-serif" fill="#2B2B28" text-anchor="middle">
    <text x="600" y="88" font-size="14" letter-spacing="5" fill="#8B8572">节气 · 节日 · 短句</text>
    <text x="600" y="148" font-size="46" font-weight="600" letter-spacing="6" font-family="Songti SC, STSong, 'Songti SC', Georgia, serif">踏雪节气拍立得</text>
    <text x="600" y="190" font-size="20" fill="#3F3C36">给一个主题，它把画面和场景推出来</text>
  </g>
</svg>
