<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">踏雪节气拍立得</title>
  <desc id="desc">给一个主题，它把画面和场景推出来。右侧是立春与元宵两张纸本档案。</desc>

  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EDE7DA"/>
      <stop offset="1" stop-color="#E3DCCE"/>
    </linearGradient>
    <linearGradient id="earth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8A8E93"/>
      <stop offset="1" stop-color="#5C6168"/>
    </linearGradient>
    <radialGradient id="lamp" cx="38%" cy="42%" r="62%">
      <stop offset="0" stop-color="#FFF1C2"/>
      <stop offset="0.45" stop-color="#F0A24A"/>
      <stop offset="1" stop-color="#6B2E12"/>
    </radialGradient>
    <clipPath id="win-chun">
      <rect x="28" y="86" width="176" height="196" rx="3"/>
    </clipPath>
    <clipPath id="win-yuan">
      <rect x="22" y="22" width="168" height="176" rx="3"/>
    </clipPath>
  </defs>

  <rect width="1200" height="480" rx="26" fill="url(#paper)"/>
  <g stroke="#D4CBB8" stroke-width="1" opacity="0.7">
    <line x1="0" y1="64" x2="1200" y2="68"/>
    <line x1="0" y1="416" x2="1200" y2="412"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans SC', 'Segoe UI', sans-serif" fill="#2B2B28">
    <text x="56" y="118" font-size="14" letter-spacing="5" fill="#8B8572">节气 · 节日 · 短句</text>
    <text x="56" y="196" font-size="46" font-weight="600" letter-spacing="5" font-family="Songti SC, STSong, Georgia, serif">踏雪节气拍立得</text>
    <text x="56" y="250" font-size="20" fill="#3F3C36">给一个主题，它把画面和场景推出来</text>
    <text x="56" y="286" font-size="16" fill="#6B665C">先想这个场景里该留下什么，再写成能出图的提示词</text>
    <text x="56" y="368" font-size="13" letter-spacing="3" fill="#8B8572">TAXUE SOLAR POLAROID</text>
  </g>

  <!-- 立春档案卡 -->
  <g transform="translate(628 52)">
    <rect x="10" y="12" width="236" height="372" rx="5" fill="#E8E2D4" stroke="#C9C0AC"/>
    <rect x="0" y="0" width="236" height="372" rx="5" fill="#F7F3E8" stroke="#C9C0AC" stroke-width="1.2"/>
    <text x="28" y="42" font-size="28" fill="#2B2B28" font-family="Songti SC, STSong, Georgia, serif">立春</text>
    <text x="28" y="68" font-size="13" fill="#8B8572" font-family="-apple-system, 'PingFang SC', sans-serif">冻土 · 微松</text>
    <g clip-path="url(#win-chun)">
      <rect x="28" y="86" width="176" height="196" fill="url(#earth)"/>
      <path d="M92 86 C88 130 118 168 108 210 C102 248 124 268 118 282" fill="none" stroke="#2B2B28" stroke-width="7" stroke-linecap="round"/>
      <path d="M92 86 C88 130 118 168 108 210 C102 248 124 268 118 282" fill="none" stroke="#D8D4CC" stroke-width="2.2"/>
      <path d="M108 210 L86 226" fill="none" stroke="#2B2B28" stroke-width="3"/>
      <path d="M114 148 L136 138" fill="none" stroke="#D8D4CC" stroke-width="1.6"/>
      <path d="M112 198 C116 186 124 180 128 168 C130 184 122 196 118 206 Z" fill="#6F9A4A"/>
      <path d="M118 206 C122 192 128 184 126 172" fill="none" stroke="#3F5C2C" stroke-width="1.2"/>
    </g>
    <rect x="28" y="86" width="176" height="196" rx="3" fill="none" stroke="#D8D0BC"/>
    <text x="28" y="314" font-size="14" fill="#57534B" font-family="-apple-system, 'PingFang SC', sans-serif">裂缝见绿</text>
    <text x="28" y="338" font-size="13" fill="#8B8572" font-family="-apple-system, 'PingFang SC', sans-serif">冰意渐薄</text>
    <text x="28" y="358" font-size="11" letter-spacing="1.4" fill="#8B8572" font-family="ui-monospace, Menlo, monospace">SEASONAL STUDY</text>
  </g>

  <!-- 元宵档案卡 -->
  <g transform="translate(888 86)">
    <rect x="8" y="10" width="224" height="348" rx="5" fill="#1B2740"/>
    <rect x="0" y="0" width="224" height="348" rx="5" fill="#243354"/>
    <rect x="14" y="14" width="196" height="320" rx="4" fill="#F6F0E2" stroke="#E4DCC8"/>
    <g clip-path="url(#win-yuan)">
      <rect x="22" y="22" width="168" height="176" fill="#1A120C"/>
      <ellipse cx="78" cy="108" rx="46" ry="58" fill="url(#lamp)"/>
      <path d="M48 70 C58 48 98 48 108 70 C116 88 116 128 108 148 C98 168 58 168 48 148 C40 128 40 88 48 70 Z" fill="none" stroke="#E8C48A" stroke-width="1.4" opacity="0.7"/>
      <ellipse cx="148" cy="158" rx="28" ry="12" fill="#F3EFE6"/>
      <ellipse cx="148" cy="154" rx="22" ry="8" fill="#C45C3A" opacity="0.55"/>
      <path d="M132 86 C128 60 140 40 138 22" fill="none" stroke="#F4EDE0" stroke-width="2" opacity="0.55"/>
      <path d="M146 90 C150 62 162 44 158 22" fill="none" stroke="#F4EDE0" stroke-width="1.6" opacity="0.4"/>
    </g>
    <rect x="22" y="22" width="168" height="176" rx="3" fill="none" stroke="#E4DCC8"/>
    <text x="22" y="230" font-size="26" fill="#2B2B28" font-family="Songti SC, STSong, Georgia, serif">元宵</text>
    <text x="22" y="256" font-size="13" fill="#8B8572" font-family="-apple-system, 'PingFang SC', sans-serif">灯纸 · 热汤</text>
    <text x="22" y="286" font-size="14" fill="#57534B" font-family="-apple-system, 'PingFang SC', sans-serif">灯纸还是热的</text>
    <text x="22" y="308" font-size="14" fill="#57534B" font-family="-apple-system, 'PingFang SC', sans-serif">汤还没凉</text>
  </g>
</svg>
