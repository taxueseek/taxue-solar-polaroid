<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="wtitle wdesc">
  <title id="wtitle">从主题到提示词</title>
  <desc id="wdesc">主题输入、创作推演卡、路由选择、编译提示词、交付与迭代，反馈后只替换失效的那一层。</desc>

  <rect width="1200" height="280" rx="26" fill="#F8F5EC"/>
  <text x="56" y="42" font-size="13" letter-spacing="3" fill="#8B8572" font-family="-apple-system, 'PingFang SC', sans-serif">主题 → 提示词</text>

  <g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans SC', sans-serif">
    <g transform="translate(36 68)">
      <rect width="188" height="128" rx="6" fill="#FFFFFF" stroke="#2B2B28" stroke-width="1.5"/>
      <text x="94" y="40" font-size="17" font-weight="600" fill="#2B2B28" text-anchor="middle">主题输入</text>
      <text x="94" y="68" font-size="13" fill="#57534B" text-anchor="middle">「处暑」「七夕」</text>
      <text x="94" y="90" font-size="13" fill="#57534B" text-anchor="middle">「春去秋来」</text>
      <text x="94" y="112" font-size="12" fill="#8B8572" text-anchor="middle">节气 / 节日 / 短句</text>
    </g>

    <path d="M232 132 L266 132" stroke="#8B8572" stroke-width="1.6" fill="none"/>
    <path d="M264 126 L274 132 L264 138 z" fill="#8B8572"/>

    <g transform="translate(282 68)">
      <rect width="196" height="128" rx="6" fill="#FFFFFF" stroke="#2B2B28" stroke-width="1.5"/>
      <text x="98" y="36" font-size="17" font-weight="600" fill="#2B2B28" text-anchor="middle">创作推演卡</text>
      <text x="98" y="64" font-size="13" fill="#57534B" text-anchor="middle">主题核 · 事实证据</text>
      <text x="98" y="86" font-size="13" fill="#57534B" text-anchor="middle">张力对 · 核心形态</text>
      <text x="98" y="108" font-size="13" fill="#57534B" text-anchor="middle">空间 · 材料 · 文案</text>
    </g>

    <path d="M486 132 L520 132" stroke="#8B8572" stroke-width="1.6" fill="none"/>
    <path d="M518 126 L528 132 L518 138 z" fill="#8B8572"/>

    <g transform="translate(536 68)">
      <rect width="188" height="128" rx="6" fill="#FFFFFF" stroke="#2B2B28" stroke-width="1.5"/>
      <text x="94" y="36" font-size="17" font-weight="600" fill="#2B2B28" text-anchor="middle">路由选择</text>
      <text x="94" y="66" font-size="13" fill="#57534B" text-anchor="middle">混合（默认）</text>
      <text x="94" y="88" font-size="13" fill="#57534B" text-anchor="middle">开放 / 固定框架</text>
      <text x="94" y="110" font-size="13" fill="#57534B" text-anchor="middle">摄影</text>
    </g>

    <path d="M732 132 L766 132" stroke="#8B8572" stroke-width="1.6" fill="none"/>
    <path d="M764 126 L774 132 L764 138 z" fill="#8B8572"/>

    <g transform="translate(782 68)">
      <rect width="188" height="128" rx="6" fill="#FFFFFF" stroke="#2B2B28" stroke-width="1.5"/>
      <text x="94" y="36" font-size="17" font-weight="600" fill="#2B2B28" text-anchor="middle">编译提示词</text>
      <text x="94" y="66" font-size="13" fill="#57534B" text-anchor="middle">命题 → 事实 → 动词</text>
      <text x="94" y="88" font-size="13" fill="#57534B" text-anchor="middle">空间 → 色彩 → 文字</text>
      <text x="94" y="110" font-size="13" fill="#57534B" text-anchor="middle">约束</text>
    </g>

    <path d="M978 132 L1012 132" stroke="#8B8572" stroke-width="1.6" fill="none"/>
    <path d="M1010 126 L1020 132 L1010 138 z" fill="#8B8572"/>

    <g transform="translate(1028 68)">
      <rect width="136" height="128" rx="6" fill="#2B2B28"/>
      <text x="68" y="40" font-size="16" font-weight="600" fill="#F8F5EC" text-anchor="middle">交付</text>
      <text x="68" y="68" font-size="12" fill="#D8D0BC" text-anchor="middle">推演 · 方案</text>
      <text x="68" y="90" font-size="12" fill="#D8D0BC" text-anchor="middle">可粘贴提示词</text>
      <text x="68" y="112" font-size="12" fill="#D8D0BC" text-anchor="middle">下一轮改一项</text>
    </g>
  </g>

  <path d="M1096 200 L1096 236 L130 236 L130 200" stroke="#8B8572" stroke-width="1.3" fill="none" stroke-dasharray="5 5"/>
  <path d="M124 206 L130 196 L136 206" stroke="#8B8572" stroke-width="1.3" fill="none"/>
  <text x="600" y="260" font-size="13" fill="#8B8572" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif">反馈「太像模板」或「不真实」时，定位失效的那一层，只替换这一层</text>
</svg>
