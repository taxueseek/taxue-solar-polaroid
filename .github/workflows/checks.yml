name: checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 结构一致性检查
        run: python3 scripts/consistency-check.py
      - name: 提示词 lint 自检
        run: python3 scripts/prompt-lint.py --selftest
